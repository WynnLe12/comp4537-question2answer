name: q2a-migration

x-db: &db
  image: mysql:8.4
  environment:
    MYSQL_DATABASE: q2a
    MYSQL_USER: q2a
    MYSQL_PASSWORD: local-q2a-only
    MYSQL_ROOT_PASSWORD: local-root-only
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 5s
    retries: 30

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  environment: &credentials
    DB_HOST: php-db
    DB_USER: q2a
    DB_PASSWORD: local-q2a-only
    DB_NAME: q2a

services:
  # Catches every email both sites and the Node API send; browse them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["127.0.0.1:8025:8025"]
  php-db:
    <<: *db
    volumes: [php-data:/var/lib/mysql]
  node-db:
    <<: *db
    volumes: [node-data:/var/lib/mysql]
  seed-php:
    <<: *php
    command: ["php", "docker/php/seed.php"]
    depends_on:
      php-db: {condition: service_healthy}
  seed-node:
    <<: *php
    environment:
      <<: *credentials
      DB_HOST: node-db
    command: ["php", "docker/php/seed.php"]
    depends_on:
      node-db: {condition: service_healthy}
  php:
    <<: *php
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      seed-php: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/?qa=login') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./node-api
    environment: &api-env
      <<: *credentials
      DB_HOST: node-db
      NODE_ENV: development
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Create .env from .env.example and set AUTH_JWT_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      BRIDGE_SECRET: ${BRIDGE_SECRET:?Create .env from .env.example and set BRIDGE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:8081}
      # Believe X-Forwarded-For only from private Docker addresses (the PHP bridge).
      TRUST_PROXY: uniquelocal
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      seed-node: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrated-ui:
    <<: *php
    environment:
      <<: *credentials
      DB_HOST: node-db
      NODE_AUTH_API: http://api:3000
      BRIDGE_SECRET: ${BRIDGE_SECRET:?Create .env from .env.example and set BRIDGE_SECRET}
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/?qa=login') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
  tests:
    build: ./node-api
    profiles: [test]
    environment:
      <<: *api-env
      PHP_URL: http://php
      PHP_DB_HOST: php-db
      API_URL: http://api:3000
      MIGRATED_UI_URL: http://migrated-ui
      MAILPIT_URL: http://mailpit:8025
    command: ["npm", "run", "test:parity"]
    depends_on:
      php: {condition: service_healthy}
      api: {condition: service_healthy}
      migrated-ui: {condition: service_healthy}

volumes:
  php-data:
  node-data:
