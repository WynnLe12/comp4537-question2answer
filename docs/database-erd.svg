<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a83c7"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #182235; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #59677c; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #68768b; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .head { fill: #edf3fa; }
      .table-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 750; }
      .table-kind { font-size: 11px; fill: #607087; }
      .field { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #27364c; }
      .key { font-weight: 750; fill: #2363a6; }
      .note { font-size: 12px; fill: #65748a; }
      .sample-head { font-size: 11px; font-weight: 750; letter-spacing: 0.6px; fill: #48566b; }
      .sample { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #39475b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .logical { fill: none; stroke: #9a83c7; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-dashed); }
      .edge-label { font-size: 11px; font-weight: 650; fill: #526178; paint-order: stroke; stroke: #f5f7fb; stroke-width: 5px; stroke-linejoin: round; }
      .pill { fill: #e8f1fb; }
      .pill-text { font-size: 11px; font-weight: 700; fill: #285d91; }
      .legend { font-size: 12px; fill: #46556a; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#f5f7fb"/>
  <text x="50" y="58" class="title">Question2Answer — Core Database ERD</text>
  <text x="52" y="88" class="subtitle">MySQL schema defined by Q2A installer + Node auth session table · local Docker demo seed records</text>
  <rect x="1515" y="38" width="235" height="36" rx="18" class="pill"/>
  <text x="1632" y="61" class="pill-text" text-anchor="middle">CORE TABLES · SCHEMA VIEW</text>
  <text x="50" y="124" class="section">IDENTITY &amp; CONTENT</text>
  <text x="1080" y="124" class="section">LOOKUP, MESSAGING &amp; SUPPORT</text>

  <!-- Relationships are behind the tables. Solid lines are declared database FKs. -->
  <path class="edge" d="M470 245 H540"/>
  <text x="475" y="232" class="edge-label">userid</text>
  <path class="edge" d="M1000 220 H1080"/>
  <text x="1008" y="207" class="edge-label">categoryid</text>
  <path class="edge" d="M770 610 V670"/>
  <text x="782" y="646" class="edge-label">postid</text>
  <path class="edge" d="M1625 370 V430"/>
  <text x="1637" y="405" class="edge-label">wordid</text>
  <path class="edge" d="M1000 560 H1040 V790 H1450 V525 H1480"/>
  <text x="1175" y="782" class="edge-label">posts.postid → posttags.postid</text>
  <path class="edge" d="M470 408 H505 V785 H540"/>
  <text x="474" y="770" class="edge-label">userid</text>
  <path class="edge" d="M470 445 H510 V640 H1045 V635 H1080"/>
  <text x="770" y="632" class="edge-label">fromuserid / touserid</text>
  <path class="logical" d="M260 480 V570"/>
  <text x="271" y="535" class="edge-label">userid</text>
  <path class="logical" d="M50 445 V820"/>
  <text x="58" y="795" class="edge-label">userid</text>
  <path class="edge" d="M50 460 V930 H520 V1040 H540"/>
  <text x="286" y="922" class="edge-label">userid</text>
  <path class="logical" d="M470 380 H500 V930 H1060 V940 H1080"/>
  <text x="815" y="922" class="edge-label">userid</text>

  <!-- users -->
  <g>
    <rect x="50" y="150" width="420" height="330" rx="12" class="card"/>
    <path d="M62 150 H458 Q470 150 470 162 V198 H50 V162 Q50 150 62 150" class="head"/>
    <text x="70" y="181" class="table-name">qa_users</text>
    <text x="450" y="180" text-anchor="end" class="table-kind">ACCOUNT</text>
    <text x="70" y="224" class="field"><tspan class="key">PK</tspan> userid INT UNSIGNED</text>
    <text x="70" y="248" class="field">handle VARCHAR(20) · email VARCHAR(80)</text>
    <text x="70" y="272" class="field">level TINYINT · flags SMALLINT</text>
    <text x="70" y="296" class="field">passhash / passsalt / passcheck</text>
    <text x="70" y="320" class="field">avatarblobid BIGINT UNSIGNED</text>
    <text x="70" y="344" class="field">created DATETIME · loggedin DATETIME</text>
    <line x1="70" y1="360" x2="450" y2="360" stroke="#e2e8f0"/>
    <text x="70" y="382" class="sample-head">SEEDED DEMO RECORDS (docker/php/seed.php)</text>
    <text x="70" y="405" class="sample">1  alice  · alice@example.test</text>
    <text x="70" y="425" class="sample">2  legacy · legacy@example.test</text>
    <text x="70" y="445" class="sample">3  bob    · bob@example.test</text>
    <text x="70" y="465" class="sample">4  carol  · carol@example.test</text>
  </g>

  <!-- posts -->
  <g>
    <rect x="540" y="150" width="460" height="460" rx="12" class="card"/>
    <path d="M552 150 H988 Q1000 150 1000 162 V198 H540 V162 Q540 150 552 150" class="head"/>
    <text x="560" y="181" class="table-name">qa_posts</text>
    <text x="980" y="180" text-anchor="end" class="table-kind">QUESTIONS · ANSWERS · COMMENTS</text>
    <text x="560" y="224" class="field"><tspan class="key">PK</tspan> postid INT UNSIGNED</text>
    <text x="560" y="248" class="field">type ENUM(Q, A, C, hidden, queued...)</text>
    <text x="560" y="272" class="field"><tspan class="key">FK</tspan> parentid → qa_posts.postid</text>
    <text x="560" y="296" class="field"><tspan class="key">FK</tspan> categoryid → qa_categories.categoryid</text>
    <text x="560" y="320" class="field"><tspan class="key">FK</tspan> userid → qa_users.userid (nullable)</text>
    <text x="560" y="344" class="field">title · content · tags · created</text>
    <text x="560" y="368" class="field">acount · selchildid · upvotes · downvotes</text>
    <text x="560" y="392" class="field">netvotes · views · hotness · flagcount</text>
    <line x1="560" y1="408" x2="980" y2="408" stroke="#e2e8f0"/>
    <text x="560" y="430" class="sample-head">SEEDED SAMPLE (parentid links answers/comments)</text>
    <text x="560" y="453" class="sample">1 Q  — Where should a JWT be stored in the browser?</text>
    <text x="560" y="473" class="sample">2 A  — Use an HttpOnly, Secure, SameSite cookie.</text>
    <text x="560" y="493" class="sample">3 A  — localStorage is simpler for mobile APIs...</text>
    <text x="560" y="523" class="sample">4 C  — Do I still need CSRF protection?</text>
    <text x="560" y="543" class="sample">   (answer/comment rows point to their parent post)</text>
    <rect x="558" y="560" width="424" height="32" rx="6" fill="#f3f6fa"/>
    <text x="570" y="581" class="note">Self-reference: one question has many child posts.</text>
  </g>

  <!-- categories -->
  <g>
    <rect x="1080" y="150" width="340" height="220" rx="12" class="card"/>
    <path d="M1092 150 H1408 Q1420 150 1420 162 V198 H1080 V162 Q1080 150 1092 150" class="head"/>
    <text x="1100" y="181" class="table-name">qa_categories</text>
    <text x="1100" y="224" class="field"><tspan class="key">PK</tspan> categoryid INT UNSIGNED</text>
    <text x="1100" y="248" class="field">parentid INT (logical tree; nullable)</text>
    <text x="1100" y="272" class="field">title · tags · content</text>
    <text x="1100" y="296" class="field">qcount · position · backpath</text>
    <text x="1100" y="335" class="note">A category can contain many questions.</text>
  </g>

  <!-- words -->
  <g>
    <rect x="1480" y="150" width="270" height="220" rx="12" class="card"/>
    <path d="M1492 150 H1738 Q1750 150 1750 162 V198 H1480 V162 Q1480 150 1492 150" class="head"/>
    <text x="1500" y="181" class="table-name">qa_words</text>
    <text x="1500" y="224" class="field"><tspan class="key">PK</tspan> wordid INT UNSIGNED</text>
    <text x="1500" y="248" class="field">word VARCHAR</text>
    <text x="1500" y="272" class="field">titlecount · contentcount</text>
    <text x="1500" y="296" class="field">tagwordcount · tagcount</text>
    <text x="1500" y="335" class="note">Search and tag dictionary.</text>
  </g>

  <!-- userpoints -->
  <g>
    <rect x="50" y="570" width="420" height="180" rx="12" class="card"/>
    <path d="M62 570 H458 Q470 570 470 582 V618 H50 V582 Q50 570 62 570" class="head"/>
    <text x="70" y="601" class="table-name">qa_userpoints</text>
    <text x="70" y="644" class="field"><tspan class="key">PK</tspan> userid INT (logical link to users)</text>
    <text x="70" y="668" class="field">points · bonus</text>
    <text x="70" y="692" class="field">qposts · aposts · cposts · aselects</text>
    <text x="70" y="722" class="note">Reputation and activity counters.</text>
  </g>

  <!-- votes -->
  <g>
    <rect x="540" y="670" width="460" height="220" rx="12" class="card"/>
    <path d="M552 670 H988 Q1000 670 1000 682 V718 H540 V682 Q540 670 552 670" class="head"/>
    <text x="560" y="701" class="table-name">qa_uservotes</text>
    <text x="560" y="744" class="field"><tspan class="key">FK</tspan> postid → qa_posts.postid</text>
    <text x="560" y="768" class="field"><tspan class="key">FK</tspan> userid → qa_users.userid</text>
    <text x="560" y="792" class="field">vote TINYINT (-1 / 0 / 1) · flag TINYINT</text>
    <text x="560" y="816" class="field">UNIQUE (userid, postid) · votecreated</text>
    <line x1="560" y1="832" x2="980" y2="832" stroke="#e2e8f0"/>
    <text x="560" y="856" class="sample-head">SEEDED SAMPLE</text>
    <text x="675" y="856" class="sample">post 1 · bob (user 3) · upvote (+1)</text>
  </g>

  <!-- messages -->
  <g>
    <rect x="1080" y="520" width="350" height="220" rx="12" class="card"/>
    <path d="M1092 520 H1418 Q1430 520 1430 532 V568 H1080 V532 Q1080 520 1092 520" class="head"/>
    <text x="1100" y="551" class="table-name">qa_messages</text>
    <text x="1100" y="594" class="field"><tspan class="key">PK</tspan> messageid INT UNSIGNED</text>
    <text x="1100" y="618" class="field"><tspan class="key">FK</tspan> fromuserid → users.userid</text>
    <text x="1100" y="642" class="field"><tspan class="key">FK</tspan> touserid → users.userid</text>
    <text x="1100" y="666" class="field">type PUBLIC / PRIVATE · content</text>
    <text x="1100" y="690" class="field">format · created · hidden flags</text>
    <text x="1100" y="719" class="note">Sender and recipient are separate user roles.</text>
  </g>

  <!-- post tags bridge -->
  <g>
    <rect x="1480" y="430" width="270" height="190" rx="12" class="card"/>
    <path d="M1492 430 H1738 Q1750 430 1750 442 V478 H1480 V442 Q1480 430 1492 430" class="head"/>
    <text x="1500" y="461" class="table-name">qa_posttags</text>
    <text x="1500" y="504" class="field"><tspan class="key">FK</tspan> postid → qa_posts.postid</text>
    <text x="1500" y="528" class="field"><tspan class="key">FK</tspan> wordid → qa_words.wordid</text>
    <text x="1500" y="552" class="field">postcreated DATETIME</text>
    <text x="1500" y="588" class="note">Many-to-many post/tag index.</text>
  </g>

  <!-- blobs -->
  <g>
    <rect x="50" y="820" width="420" height="180" rx="12" class="card"/>
    <path d="M62 820 H458 Q470 820 470 832 V868 H50 V832 Q50 820 62 820" class="head"/>
    <text x="70" y="851" class="table-name">qa_blobs</text>
    <text x="70" y="894" class="field"><tspan class="key">PK</tspan> blobid BIGINT UNSIGNED</text>
    <text x="70" y="918" class="field">format · content MEDIUMBLOB · filename</text>
    <text x="70" y="942" class="field">userid · cookieid · created</text>
    <text x="70" y="974" class="note">Avatars and uploaded/editor media.</text>
  </g>

  <!-- favorites -->
  <g>
    <rect x="540" y="960" width="460" height="190" rx="12" class="card"/>
    <path d="M552 960 H988 Q1000 960 1000 972 V1008 H540 V972 Q540 960 552 960" class="head"/>
    <text x="560" y="991" class="table-name">qa_userfavorites</text>
    <text x="560" y="1034" class="field"><tspan class="key">FK</tspan> userid → qa_users.userid</text>
    <text x="560" y="1058" class="field">entitytype CHAR(1) · entityid INT</text>
    <text x="560" y="1082" class="field">nouserevents · PK (userid, entitytype, entityid)</text>
    <text x="560" y="1120" class="note">entityid is polymorphic (post / user / tag / category).</text>
  </g>

  <!-- sessions -->
  <g>
    <rect x="1080" y="850" width="350" height="190" rx="12" class="card"/>
    <path d="M1092 850 H1418 Q1430 850 1430 862 V898 H1080 V862 Q1080 850 1092 850" class="head"/>
    <text x="1100" y="881" class="table-name">node_auth_sessions</text>
    <text x="1100" y="924" class="field"><tspan class="key">PK</tspan> token_hash CHAR(64)</text>
    <text x="1100" y="948" class="field">userid INT UNSIGNED</text>
    <text x="1100" y="972" class="field">expires_at DATETIME</text>
    <text x="1100" y="1014" class="note">Added by docker/php/seed.php for Node auth.</text>
  </g>

  <!-- Footer / notation -->
  <line x1="50" y1="1180" x2="1750" y2="1180" stroke="#d7dee8"/>
  <text x="50" y="1210" class="section">RELATIONSHIP NOTATION</text>
  <path class="edge" d="M260 1206 H335"/>
  <text x="350" y="1211" class="legend">Solid = declared foreign key in Q2A schema</text>
  <path class="logical" d="M680 1206 H755"/>
  <text x="770" y="1211" class="legend">Dashed = logical relationship (no declared FK)</text>
  <text x="50" y="1248" class="note">Scope: selected core tables, not every Q2A configuration, event, cache, limits, and metadata table.</text>
  <text x="1750" y="1248" text-anchor="end" class="note">Source: qa-include/db/install.php · docker/php/seed.php</text>
</svg>
